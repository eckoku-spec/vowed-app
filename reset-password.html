<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Vowed</title>
<style>
  body {
    background: #0f0f0f; color: #fff; font-family: -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px;
  }
  .card {
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; padding: 32px 24px;
    width: 100%; max-width: 380px; text-align: center;
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { color: #888; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
  input {
    width: 100%; background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 10px;
    padding: 14px; color: #fff; font-size: 15px; margin-bottom: 12px; box-sizing: border-box;
  }
  button {
    width: 100%; background: #c8f65a; color: #0f0f0f; border: none; border-radius: 10px;
    padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  .msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
  .msg.error { color: #ef4444; }
  .msg.success { color: #c8f65a; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔑 Reset Your Password</h1>
    <p>Enter a new password for your Vowed account.</p>
    <input type="password" id="newPassword" placeholder="New password (min 6 characters)">
    <button id="submitBtn" onclick="resetPassword()">Update Password</button>
    <div class="msg" id="msg"></div>
  </div>

  <p id="debugStatus" style="font-size: 11px; color: #555; margin-top: -8px; word-break: break-all;"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.getElementById('debugStatus').textContent = 'ERROR: Could not load Supabase library from CDN.'"></script>
  <script>
    window.addEventListener('error', function (e) {
      const d = document.getElementById('debugStatus');
      if (d) d.textContent = 'JS Error: ' + e.message;
    });

    const SUPABASE_URL = 'https://oqpzmsrrdrfjndeyhilh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xcHptc3JyZHJmam5kZXloaWxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NzUwMzUsImV4cCI6MjA5NzA1MTAzNX0.RjvwPMnOzsZDn90fAbbN33Lnx48bEzgdaVLNcYeQZ_s';

    let supabase;
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      document.getElementById('debugStatus').textContent = 'Init error: ' + e.message;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const debugStatus = document.getElementById('debugStatus');
      const hasHashToken = window.location.hash.includes('access_token');
      const hasErrorInUrl = window.location.hash.includes('error');

      if (hasErrorInUrl) {
        debugStatus.textContent = 'Link error: ' + decodeURIComponent(window.location.hash);
        return;
      }

      if (!hasHashToken) {
        debugStatus.textContent = 'No access token found in URL. Link may be invalid or expired.';
      }

      // Supabase needs a moment to parse the hash and set the session
      setTimeout(async () => {
        const { data, error } = await supabase.auth.getSession();
        if (error) {
          debugStatus.textContent = 'Session check error: ' + error.message;
        } else if (data?.session) {
          debugStatus.textContent = 'Ready to reset password for: ' + (data.session.user?.email || 'unknown');
        } else {
          debugStatus.textContent = 'No active recovery session found. The link may have expired — request a new one.';
        }
      }, 800);
    });

    async function resetPassword() {
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submitBtn');
      const newPassword = document.getElementById('newPassword').value;

      if (!newPassword || newPassword.length < 6) {
        msg.textContent = 'Password must be at least 6 characters.';
        msg.className = 'msg error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const { data, error } = await supabase.auth.updateUser({ password: newPassword });

        btn.disabled = false;
        btn.textContent = 'Update Password';

        if (error) {
          msg.textContent = 'Error: ' + error.message;
          msg.className = 'msg error';
        } else {
          msg.textContent = 'Password updated! You can now return to the app and sign in.';
          msg.className = 'msg success';
        }
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Update Password';
        msg.textContent = 'Unexpected error: ' + e.message;
        msg.className = 'msg error';
      }
    }
  </script>
</body>
</html>
